name: aggregate-nodes

on:
  schedule:
    - cron: '23 */6 * * *'   # 每 6 小时（UTC），避开整点高峰
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --frozen

      - name: Aggregate nodes
        run: uv run --frozen python scripts/aggregate.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash.yaml v2ray.txt README.md
          if git diff --cached --quiet; then
            echo "节点无变化，跳过提交"
          else
            git commit -m "chore: update nodes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
